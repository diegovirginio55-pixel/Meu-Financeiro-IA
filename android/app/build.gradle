plugins {
    id 'com.android.application'
}

// A chave de assinatura vem dos segredos do GitHub (nunca do repositório):
// a mesma chave em todo build, para cada versão nova instalar por cima da anterior.
def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace 'br.com.meufinanceiroia'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.meufinanceiroia'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias 'meufinanceiro'
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core:1.13.1'
}
