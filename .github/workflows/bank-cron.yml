name: Sincronizar bancos e notificações

# RESERVA. Na prática o GitHub roda este agendamento a cada 3–8 HORAS (não
# a cada 10 min) — por isso o cron principal agora é o pg_cron do Supabase
# (supabase/migrations/0011_cron_keepalive.sql), a cada 5 min. Este fica
# como rede de segurança caso o do Supabase pare.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de sincronização
        env:
          BANK_CRON_SECRET: ${{ secrets.BANK_CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://meu-financeiro-ia.onrender.com' }}
        run: |
          curl --fail --show-error --max-time 90 \
            -H "Authorization: Bearer $BANK_CRON_SECRET" \
            "$SITE_URL/api/bank/cron"
